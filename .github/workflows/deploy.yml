name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Build the site and publish it to the gh-pages branch, which GitHub Pages
# serves. This uses a single job (avoids the separate deploy-pages job that
# sometimes can't acquire a hosted runner).
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Tests gate the deploy: unit (vitest), then e2e (Playwright, Chromium).
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
